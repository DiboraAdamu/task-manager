<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persistent Task Manager</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        #app {
            background: #ffffff;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 350px;
        }
        h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
        }
        .input-group, .filter-group, .footer-group {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }
        .input-group input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 8px 12px;
            cursor: pointer;
            border: 1px solid #ccc;
            background-color: #e9e9e9;
            border-radius: 4px;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #dcdcdc;
        }
        .filter-btn.active {
            background-color: #007bff;
            color: white;
            border-color: #006fe6;
        }
        ul {
            list-style: none;
            padding: 0;
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 15px;
        }
        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid #eee;
        }
        li.completed span {
            text-decoration: line-through;
            color: #888;
        }
        .task-actions {
            display: flex;
            gap: 5px;
        }
        .footer-group {
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: #555;
            margin-bottom: 0;
        }
    </style>
</head>
<body>

    <div id="app">
        <h2>Task Manager</h2>
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="New task...">
            <button id="addBtn">Add</button>
        </div>
        <div class="filter-group">
            <button id="showAllBtn" class="filter-btn active">All</button>
            <button id="showActiveBtn" class="filter-btn">Active</button>
            <button id="showDoneBtn" class="filter-btn">Done</button>
        </div>
        <ul id="taskList"></ul>
        <div class="footer-group">
            <span id="counter"></span>
            <button id="clearDoneBtn">Clear Done</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
